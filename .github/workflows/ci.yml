name: GRADE

on:
  push:
    paths:
      - 'kernel/**'
      - 'user/**'
      - 'mkfs/**'
      - 'conf/**'
      - 'Makefile'
      - 'gradelib.py'
      - 'grade-lab-*'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - 'user/**'
      - 'mkfs/**'
      - 'conf/**'
      - 'Makefile'
      - 'gradelib.py'
      - 'grade-lab-*'
      - '.github/workflows/ci.yml'

jobs:
  grade:
    name: Grade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Install the bare-metal GCC toolchain, not `gcc-riscv64-linux-gnu`
      # stated on the course website
      # (https://pdos.csail.mit.edu/6.828/2023/tools.html), which targets
      # the Linux ABI and causes linker errors with stack-protector symbols
      # in a freestanding kernel. `apt-get update` runs first to avoid 404
      # errors from stale mirror metadata.
      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf qemu-system-misc

      # Add RISC-V bare-metal target support:
      # https://doc.rust-lang.org/rustc/platform-support/riscv64gc-unknown-linux-gnu.html
      # kernel/rust-toolchain.toml pins the nightly channel, so the target
      # must be added to nightly explicitly rather than to the default
      # toolchain.
      - name: Install Rust RISC-V target
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly riscv64gc-unknown-none-elf

      - name: GRADE
        run: make grade
