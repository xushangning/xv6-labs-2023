name: make grade

on:
  push:
    paths:
      - 'kernel/**'
      - 'user/**'
      - 'mkfs/**'
      - 'conf/**'
      - 'Makefile'
      - 'gradelib.py'
      - 'grade-lab-*'
  pull_request:
    paths:
      - 'kernel/**'
      - 'user/**'
      - 'mkfs/**'
      - 'conf/**'
      - 'Makefile'
      - 'gradelib.py'
      - 'grade-lab-*'

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf qemu-system-misc

      - name: Install Rust RISC-V target
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly riscv64gc-unknown-none-elf

      - name: Verify toolchain
        run: |
          riscv64-unknown-elf-gcc --version
          qemu-system-riscv64 --version

      - name: make grade
        run: make grade
